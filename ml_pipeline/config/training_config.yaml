# NaviCore AI: 1D-TCN Training Configuration
experiment:
  name: "navicore_tcn_iovnbd"
  seed: 42
  dataset_version: "iovnbd_v1.0_coventry"
  output_dir: "models/checkpoints"

data:
  raw_data_dir: "../data/raw_iovnbd"
  training_rate_hz: 10          # Native IO-VNBD sampling rate (Hz)
  device_sampling_rate_hz: 100  # On-device Android IMU sampling rate (Hz)
  window_len_samples: 10        # 1.0 second window at 10 Hz (10 samples)
  stride_samples: 1             # 0.1 second stride (10 Hz output)
  train_split_ratio: 0.8
  val_split_ratio: 0.1
  test_split_ratio: 0.1

model:
  in_channels: 6                # [ax, ay, az, gx, gy, gz]
  stem_filters: 32
  stem_kernel_size: 7
  residual_blocks:
    - { dilation: 1, filters: 32, kernel_size: 3 }
    - { dilation: 2, filters: 64, kernel_size: 3 }
    - { dilation: 4, filters: 128, kernel_size: 3 }
  se_reduction: 4
  bottleneck_units: 64
  dropout_prob: 0.2

training:
  epochs: 60
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: "cosine_annealing"
  loss_weights:
    speed_nll: 1.0
    zupt_bce: 0.5
    smoothness: 0.1
  early_stopping_patience: 10

quantization:
  method: "ptq_int8"           # Post-Training Quantization INT8
  calibration_samples: 500
  target_delegate: "nnapi"     # Android NNAPI / Hexagon NPU
